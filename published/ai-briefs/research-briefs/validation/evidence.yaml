    url: https://arxiv.org/abs/2606.26300
    pdf_hash:
  verified: 2026-06-29
  status: primary
- id: ev-okumura-causal-caution-2026
  claim: "LLM causal caution (refusing to assert causation from correlation) under academic vs practical-advice framing, and recovery after a self-correction prompt — 4 models, 480 trials"
  value: "caution 91.7-100% (academic) -> 6.7-18.3% (advice) -> 71.4-100% (after re-prompt)"
  wording: "Across four models and 480 trials, causal caution held in 91.7-100.0% of academic-framed responses but only 6.7-18.3% under practical-advice framing; a single reconsider-from-a-causal-perspective prompt restored it to 71.4-100.0%."
  source:
    org: "Okumura (Mitsubishi Research Institute / Kobe University)"
    report: "When Helpfulness Overrides Causal Caution: Context-Dependent Suppression and Recovery in LLMs"
    edition: 2026
    url: https://arxiv.org/abs/2606.24370
    pdf_hash:
  verified: 2026-06-29
  status: primary
- id: ev-demirer-chaining-tasks-2026
  claim: "Theory of AI 'chains' (runs of adjacent AI-executed steps) tested on 872 US occupations: AI-executed steps cluster, dispersed AI-exposed steps go with less AI execution, and a step next to an AI-executed step is more likely to be AI-executed. Correlational; AI execution is measured from Claude usage only (Anthropic Economic Index) and the task order is generated by GPT-5-mini. STAKE: two authors are at Microsoft; the NBER release page (nber.org/papers/w34859) carries co-author John Horton's disclosure that he is 'a paid advisor to Anthropic', the data provider, and the arXiv version carries none; Horton also co-founded Expected Parrot, the tool used for the task ordering, which neither version discloses"
  value: "average AI chain 1.45 steps; adjacent AI-executed step +12 points raw, +4 to 5 points with the tightest controls"
  wording: "Empirical evidence supports the model's key predictions that (1) AI-executed steps co-occur in chains, (2) dispersion of AI-exposed steps lowers AI execution at the job level, and (3) adjacency to AI-executed steps increases the likelihood that a step is AI-executed. ... the average AI chain length in the original dataset is 1.45, and the average number of AI chains per occupation is 2.10 ... while we do not claim that these relationships are causal"
  source:
    org: "Demirer, Horton, Immorlica, Lucier & Shahidi (MIT, Yale, Microsoft)"
    report: "Chaining Tasks, Redefining Work: A Theory of AI Automation"
    edition: 2026
    url: https://arxiv.org/abs/2606.15960
    pdf_hash: sha256:db79329c75f412b0865f6334cf4cd4f015442dab9d9945d7e9fd0b36a49583d5
  verified: 2026-09-15
  status: primary
