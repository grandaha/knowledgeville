- id: ev-oecd-2026-self-hosting-scale-only
  claim: "Self-hosting open-weight models pays off only at scale; below about 100 million tokens a month the OECD found no saving"
  value: "under 100M tokens/month: no benefit; medium ~30 months to break even (text: 1B tokens/month; Table 3.3: 500M, 30.4 months); large ~2 months (text: 10B; Table 3.3: 5B, 1.8 months); owned hardware only, GPU rental can pay off at modest volumes"
  wording: "Self-hosting of open-weight models becomes cost-effective only at scale. ... The economic benefits of self-hosting are not evident for small workloads (less than 100 million tokens per month). Under medium workloads (1 billion tokens per month), private hosting becomes cheaper than pay-as-you-go cloud services only after 2.5 years (around 30 months). ... Table 3.3. Breakeven months for cloud API vs private GPU installation scenarios ... Medium (500 million tokens per month) 30.4 ... Under certain assumptions, GPU rental can therefore be cost-effective even at relatively modest usage levels."
  source:
