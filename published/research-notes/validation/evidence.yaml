- id: ev-norman-2026-judge-validity
  claim: "Large-scale study of 21 LLM judges: raw agreement overstates chance-corrected agreement, rankings are unstable, and consistency coexists with position bias"
  value: "21 judges; ~541,000 judgments; 33-41 pp kappa deflation on MT-Bench; rankings shift up to 14 positions"
  wording: "21 judges from nine providers across MT-Bench, JudgeBench, and RewardBench, evaluated under three protocols (agreement, consistency, bias audit) over 118 runs and approximately 541,000 individual judgments. Four findings emerge, consistent across the full cohort, including the April 2026 frontier: kappa deflation between exact match and Cohen's kappa is universal (33--41 pp on MT-Bench), judge rankings shift by up to 14 positions across benchmarks, high test--retest reliability (>0.95) coexists with severe position bias (>0.10) in two production-deployed judges"
  source:
    org: Norman et al.
    report: "Reliability without Validity: A Systematic, Large-Scale Evaluation of LLM-as-a-Judge Models Across Agreement, Consistency, and Bias (arXiv 2606.19544)"
    edition: 2026
    url: https://arxiv.org/abs/2606.19544
