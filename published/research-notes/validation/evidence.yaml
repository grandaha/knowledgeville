- id: ev-bird-benchmark-human-gap-2023
  claim: "On the BIRD text-to-SQL benchmark over real databases, the gap between the leading model and human annotators was large at publication"
  value: "54.89% execution accuracy for GPT-4 vs 92.96% human"
  wording: "even the most effective text-to-SQL models, i.e. GPT-4, only achieve 54.89% in execution accuracy, which is still far from the human result of 92.96%"
  source:
    org: "Li et al. (University of Hong Kong and collaborators)"
    report: "Can LLM Already Serve as A Database Interface? A BIg Bench for Large-Scale Database Grounded Text-to-SQLs (BIRD), arXiv:2305.03111 (v3, NeurIPS version of record — the arXiv abstract PAGE still renders the superseded v1 abstract, which says ChatGPT/40.08%; quote the v3 full text, not the abs page)"
    edition: 2023
    url: https://ar5iv.labs.arxiv.org/html/2305.03111
    pdf_hash:
  verified: 2026-08-10
  status: primary
  expires: 2027-08-10
- id: ev-bird-external-knowledge-delta-2023
  claim: "BIRD publishes a controlled with/without comparison of hand-written external-knowledge annotations on identical questions, for models and for humans"
  value: "Development set (the only split with a human result): GPT-4 30.90% without knowledge to 46.35% with (+15.45 points); human 72.37% to 92.96% (+20.59). Test set, models only: GPT-4 34.88% to 54.89% (+20.01)"
  wording: "The Execution Accuracy (EX) of advanced text-to-SQL models in Bird. The human performance is also provided."
  source:
    org: "Li et al. (University of Hong Kong and collaborators)"
    report: "BIRD, arXiv:2305.03111 (v3), Table 2 — columns 'w/o knowledge' and 'w/ knowledge' for development and testing data"
    edition: 2023
    url: https://ar5iv.labs.arxiv.org/html/2305.03111
    pdf_hash:
  verified: 2026-08-10
  status: primary
  expires: 2027-08-10
- id: ev-bird-external-knowledge-design-2023
  claim: "BIRD supplies hand-written external knowledge annotations because schema alone does not carry the meaning a query needs"
  value: "external knowledge grounding is a named component of the benchmark"
  wording: "Our emphasis on database values highlights the new challenges of dirty and noisy database values, external knowledge grounding between NL questions and database values, and SQL efficiency, particularly in the context of massive databases."
  source:
    org: "Li et al. (University of Hong Kong and collaborators)"
    report: "Can LLM Already Serve as A Database Interface? A BIg Bench for Large-Scale Database Grounded Text-to-SQLs (BIRD), arXiv:2305.03111 (v3)"
